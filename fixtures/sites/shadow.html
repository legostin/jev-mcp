<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shadow DOM</title></head>
<body style="font:15px sans-serif;padding:24px">
<h1>Newsletter</h1>
<news-form></news-form>
<script>
customElements.define('news-form', class extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: 'open' });
    root.innerHTML = `<form><label for="em">Work email</label> <input id="em" type="email">
      <button type="button" id="sub">Subscribe</button><p id="ok"></p></form>`;
    root.getElementById('sub').addEventListener('click', () => { root.getElementById('ok').textContent = 'Subscribed'; });
  }
});
</script>
</body></html>
